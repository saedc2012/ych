<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>失落文明的機關開關 (5x5)</title>
<style>
:root {
  --bg-dark: #0f0d0b;
  --gold: #d4af37;
  --gold-glow: #ffd700;
  --stone: #2b2622;
  --border: #4a3e35;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-dark);
  color: #e0d8c3;
  font-family: serif, system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

.controls {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
}
.btn {
  border: 1px solid var(--gold);
  background: rgba(20, 16, 12, 0.85);
  color: var(--gold);
  border-radius: 4px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  letter-spacing: 1px;
}
.btn:hover {
  background: var(--gold);
  color: #000;
}

.board-wrapper {
  position: relative;
  width: min(92vw, 92vh);
  height: min(92vw, 92vh);
  background-image: url('https://www.salvationarmy.org.hk/ssd/schs/sites/sa_schs/files/uploadfiles/Gemini_Generated_Image_wj8nfiwj8nfiwj8n.jpg');
  background-size: cover;
  background-position: center;
  border: 4px solid var(--border);
  box-shadow: 0 0 30px rgba(0,0,0,0.9);
  overflow: hidden;
}

/* 5x5 網格 */
.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(5, 1fr);
  width: 100%;
  height: 100%;
  gap: 0;
}

.card {
  position: relative;
  border: 1px solid rgba(0,0,0,0.6);
  background: transparent;
  padding: 0;
  cursor: pointer;
  perspective: 600px;
  outline: none;
}

.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card.matched {
  pointer-events: none;
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
}

.back {
  background: linear-gradient(135deg, #3a322b 0%, #1a1512 100%);
  border: 1px solid #5a4a3e;
}

.back::after {
  content: attr(data-coord);
  font-size: clamp(14px, 3.2vw, 26px);
  font-weight: bold;
  color: var(--gold);
  text-shadow: 0 0 6px rgba(212, 175, 55, 0.4);
  font-family: monospace, serif;
}

.front {
  transform: rotateY(180deg);
  background: #181410;
  font-size: clamp(22px, 5.5vw, 42px);
  border: 1px solid var(--gold);
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.3) inset;
}

.card.joker .front {
  background: #3a1c1c;
  border-color: #ff4d4d;
  color: #ff4d4d;
}
</style>
</head>
<body>

<div class="controls">
  <button class="btn" id="reset">重置機關</button>
</div>

<div class="board-wrapper">
  <div id="board" class="board"></div>
</div>

<script>
// 12 對古老圖案標誌
const icons = ['𓁹', '𓃠', '𓋹', '🔱', '🏺', '🐍', '📜', '💎', '🗿', '𓆣', '⚖️', '🔮'];
// 1 張幸運 Joker 牌
const jokerIcon = '🃏';

let first = null, second = null, lock = false;
const board = document.querySelector('#board');

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  first = second = null;
  lock = false;
  board.innerHTML = '';

  // 生成 5x5 (A1 至 E5) 座標名稱
  const rows = ['A', 'B', 'C', 'D', 'E'];
  const coords = [];
  for (let r = 0; r < 5; r++) {
    for (let c = 1; c <= 5; c++) {
      coords.push(rows[r] + c);
    }
  }

  // 組合卡牌：12對圖案(24張) + 1張Joker = 25張
  const deck = shuffle([...icons, ...icons, jokerIcon]);

  deck.forEach((icon, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    if (icon === jokerIcon) b.classList.add('joker-card');
    b.dataset.value = icon;
    
    b.innerHTML = `
      <span class="card-inner">
        <span class="face back" data-coord="${coords[i]}"></span>
        <span class="face front">${icon}</span>
      </span>
    `;
    b.addEventListener('click', () => pick(b));
    board.appendChild(b);
  });
}

function pick(card) {
  if (lock || card === first || card.classList.contains('matched') || card.classList.contains('flipped')) return;

  card.classList.add('flipped');

  // 如果翻到 Joker 幸運牌，直接消去並露出底圖！
  if (card.dataset.value === jokerIcon) {
    setTimeout(() => {
      card.classList.add('matched');
    }, 600);
    return;
  }

  if (!first) {
    first = card;
    return;
  }

  second = card;
  lock = true;

  if (first.dataset.value === second.dataset.value) {
    first.classList.add('matched');
    second.classList.add('matched');
    first = second = null;
    lock = false;
  } else {
    setTimeout(() => {
      first.classList.remove('flipped');
      second.classList.remove('flipped');
      first = second = null;
      lock = false;
    }, 900);
  }
}

document.querySelector('#reset').onclick = init;
init();
</script>
</body>
</html>
