<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>失落文明的機關開關 (5x5)</title>
<style>
:root {
  --bg-dark: #0a0908;
  --gold: #ffd700;
  --gold-shadow: rgba(255, 215, 0, 0.5);
  --stone-dark: #1e1b18;
  --stone-border: #8b7355;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-dark);
  color: #e0d8c3;
  font-family: serif, system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

.controls {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 100;
  display: flex;
  gap: 10px;
}
.btn {
  border: 2px solid var(--gold);
  background: rgba(10, 9, 8, 0.9);
  color: var(--gold);
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0,0,0,0.9), 0 0 8px var(--gold-shadow);
  backdrop-filter: blur(4px);
  letter-spacing: 1px;
  transition: all 0.2s ease;
}
.btn:hover {
  background: var(--gold);
  color: #000;
  box-shadow: 0 0 16px var(--gold);
}

.board-wrapper {
  position: relative;
  width: min(92vw, 92vh);
  height: min(92vw, 92vh);
  background-image: url('https://www.salvationarmy.org.hk/ssd/schs/sites/sa_schs/files/uploadfiles/Gemini_Generated_Image_wj8nfiwj8nfiwj8n.jpg');
  background-size: cover;
  background-position: center;
  border: 4px solid var(--stone-border);
  box-shadow: 0 0 35px rgba(0,0,0,0.95);
  overflow: hidden;
}

/* 5x5 網格 */
.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(5, 1fr);
  width: 100%;
  height: 100%;
  gap: 0;
}

.card {
  position: relative;
  border: 1px solid rgba(0, 0, 0, 0.85);
  background: transparent;
  padding: 0;
  cursor: pointer;
  perspective: 600px;
  outline: none;
}

.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card.matched {
  pointer-events: none;
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
}

/* 卡牌背面 - 厚重石板黑金風格 */
.back {
  background: radial-gradient(circle, #2c2520 0%, #12100e 100%);
  border: 2px solid #5a4a3e;
}

.back::after {
  content: attr(data-coord);
  font-size: clamp(16px, 3.8vw, 30px);
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 0 8px var(--gold), 0 0 12px #000000, 2px 2px 4px #000000;
  font-family: 'Courier New', monospace, serif;
}

/* 卡牌正面 - 亮金色古老符號 */
.front {
  transform: rotateY(180deg);
  background: #14110e;
  font-size: clamp(24px, 6vw, 46px);
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.4) inset;
}

.card.joker .front {
  background: #4a1212;
  border-color: #ff3333;
  color: #ff6666;
  box-shadow: 0 0 20px rgba(255, 51, 51, 0.6) inset;
}
</style>
</head>
<body>

<div class="controls">
  <button class="btn" id="reset">重置機關</button>
  <button class="btn" id="close-btn">返回 Canva</button>
</div>

<div class="board-wrapper">
  <div id="board" class="board"></div>
</div>

<script>
// 12 對古老圖案標誌
const icons = ['𓁹', '𓃠', '𓋹', '🔱', '🏺', '🐍', '📜', '💎', '🗿', '𓆣', '⚖️', '🔮'];
// 1 張幸運 Joker 牌
const jokerIcon = '🃏';

let first = null, second = null, lock = false, matchedCount = 0;
const board = document.querySelector('#board');

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  first = second = null;
  lock = false;
  matchedCount = 0;
  board.innerHTML = '';

  // 生成 5x5 (A1 至 E5) 座標名稱
  const rows = ['A', 'B', 'C', 'D', 'E'];
  const coords = [];
  for (let r = 0; r < 5; r++) {
    for (let c = 1; c <= 5; c++) {
      coords.push(rows[r] + c);
    }
  }

  // 組合卡牌：12對圖案(24張) + 1張Joker = 25張
  const deck = shuffle([...icons, ...icons, jokerIcon]);

  deck.forEach((icon, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    if (icon === jokerIcon) b.classList.add('joker');
    b.dataset.value = icon;
    
    b.innerHTML = `
      <span class="card-inner">
        <span class="face back" data-coord="${coords[i]}"></span>
        <span class="face front">${icon}</span>
      </span>
    `;
    b.addEventListener('click', () => pick(b));
    board.appendChild(b);
  });
}

function checkWin() {
  // 當 25 張牌完全解開露出底圖時
  if (matchedCount === 25) {
    setTimeout(() => {
      alert('🎉 機關已完全解開！即將返回簡報。');
      exitGame();
    }, 600);
  }
}

function exitGame() {
  // 嘗試關閉當前分頁以回到 Canva
  window.close();
  // 若瀏覽器安全限制阻止自動關閉，則進行備用提示
  setTimeout(() => {
    alert('請按鍵盤 Ctrl + W (Mac: Cmd + W) 或關閉此分頁返回 Canva 簡報！');
  }, 300);
}

function pick(card) {
  if (lock || card === first || card.classList.contains('matched') || card.classList.contains('flipped')) return;

  card.classList.add('flipped');

  // 翻到 Joker 幸運牌，直接消去露出底圖
  if (card.dataset.value === jokerIcon) {
    setTimeout(() => {
      card.classList.add('matched');
      matchedCount += 1;
      checkWin();
    }, 600);
    return;
  }

  if (!first) {
    first = card;
    return;
  }

  second = card;
  lock = true;

  if (first.dataset.value === second.dataset.value) {
    first.classList.add('matched');
    second.classList.add('matched');
    matchedCount += 2;
    first = second = null;
    lock = false;
    checkWin();
  } else {
    setTimeout(() => {
      first.classList.remove('flipped');
      second.classList.remove('flipped');
      first = second = null;
      lock = false;
    }, 900);
  }
}

document.querySelector('#reset').onclick = init;
document.querySelector('#close-btn').onclick = exitGame;
init();
</script>
</body>
</html>
